[pytest]
# Pytest configuration for Newsletter to Podcast API tests

# Markers for test categorization
markers =
    unit: Unit tests that mock all external dependencies (MongoDB, Redis)
    integration: Integration tests that use real MongoDB and Redis
    e2e: End-to-end tests (excluded by default)

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --strict-markers
    --tb=short
    -m unit

# Default to unit tests only (fast feedback)
testpaths = tests

# Minimum Python version
minversion = 7.0
